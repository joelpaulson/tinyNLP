[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinynlp-opt"
version = "0.0.0"
description = "A tinygrad-inspired, CPU-first nonlinear programming execution substrate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Joel Paulson" },
]
keywords = [
  "nonlinear-programming",
  "optimization",
  "autodiff",
  "sparsity",
  "kkt",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/joelpaulson/tinyNLP"
Repository = "https://github.com/joelpaulson/tinyNLP"

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-benchmark>=4.0",
  "ruff>=0.11",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["tinynlp"]
ignore_missing_imports = true
allow_untyped_defs = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_configs = true
